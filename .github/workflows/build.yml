name: Build & Test

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build bennetsen-mines
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -B

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bennetsen-mines-jar
          path: target/bennetsen-mines-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Extract Tag or Commit
        if: startsWith(github.ref, 'refs/tags/v')
        id: vars
        run: |
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "release_title=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/bennetsen-mines-*.jar
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

