name: bennetsen-mines
version: '${project.version}'
main: dk.ggsmp.mines.BennetsenMines
api-version: '1.21'
description: Modern async mine management plugin for Paper servers
author: Bennetsen
softdepend:
  - FastAsyncWorldEdit
  - WorldEdit
  - FancyHolograms
  - WorldGuard

commands:
  bm:
    description: BennetsenMines management command
    permission: bennetsenmines.admin
    usage: /<command> [subcommand]
    aliases:
      - bennetsenmines
      - bmines
      - mrl

permissions:
  bennetsenmines.admin:
    description: Full administration permissions for bennetsen-mines
    default: op

